function createHandler({ kv, token, seed }) {
  const enc = (k) => k.replace(/\//g, "~"), dec = (k) => k.replace(/~/g, "/");
  const sleep2 = (ms) => new Promise((r) => setTimeout(r, ms));
  const J = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" } });
  const same = (a, b) => {
    if (a.length !== b.length) return false;
    let r = 0;
    for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return r === 0;
  };

    for (const k of Object.keys(s)) {

      if (v === null) delete t[k];
      else if (isObj(v) && isObj(t[k])) merge(t[k], v);

  };

    if (isObj(d) && isObj(d.m)) {

  };
  const okPath = (p) => typeof p === "string" && /^[A-Za-z0-9_\-.:@+]+\/[A-Za-z0-9_\-.:@+]+$/.test(p) && p.split("/").every((s) => !/^\.+$/.test(s));
  let seeded = false;

    if (seeded) return;
    if (!await kv.get("_init")) {
      for (const [p, b] of Object.entries(seed.docs || {})) await kv.set(enc(p), b);
      await kv.set("_init", { t: Date.now() });
    }
    seeded = true;
  }
  async function readAll() {
    const keys = (await kv.list()).filter((k) => !k.startsWith("_")), docs = {};
    let i = 0;
    await Promise.all(Array.from({ length: 12 }, async () => {
      while (i < keys.length) {
        const k = keys[i++], r = await kv.get(k);
        if (r) docs[dec(k)] = r.value;

  }
  async function apply(op) {
    if (!op || !okPath(op.path)) throw new Error("bad path");
    const key = enc(op.path);
    if (op.op === "delete") {
      await kv.del(key);
      return;
    }
    if (op.op === "set") {
      await kv.set(key, strip(op.data || {}));

    if (!url.pathname.startsWith("/api/")) return J({ error: "not found" }, 404);
    if (req.method !== "POST") return J({ error: "method" }, 405);
    const auth = (req.headers.get("authorization") || "").replace(/^Bearer\s+/i, "");
    const ip = (req.headers.get("x-nf-client-connection-ip") || (req.headers.get("x-forwarded-for") || "").split(",")[0] || "unknown").trim().replace(/[^A-Za-z0-9.:-]/g, "_");
    const fk = "_fail~" + ip, now = Date.now(), fr = await kv.get(fk), fv = fr && now - fr.value.t < 6e5 ? fr.value : null;
    if (fv && fv.n >= 10) return J({ error: "too many attempts" }, 429);

      await kv.set(fk, { n: (fv ? fv.n : 0) + 1, t: now });

    }
    if (fr) await kv.del(fk);
    let body = {};
    try {
      body = await req.json();
    } catch (e) {
    }
    try {
      await ensureSeed();
      const route = url.pathname.slice(5);
      if (route === "state") {
        const rev = await kv.get("_rev");
        return J({ docs: await readAll(), rev: rev ? rev.value : null, base: body.withBase ? seed.base : void 0 });
